<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>
<head>
  <meta http-equiv="refresh" content="1800">
  <title>mdc</title>
  <style type="text/css">
    body {
      font-family: Arial, sans-serif;
      font-size: 11px;
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      overflow: hidden; /* Evita scroll si no es necesario */
    }
    .contenedor {
      display: flex;
      justify-content: center;
      align-items: flex-start; /* Alineación superior */
      height: 100vh;
      margin-top: 15px;
    }
    .countdown-badge {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #333;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 11px;
      color: #888;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .countdown-time {
      color: #00ff88;
      font-weight: bold;
      margin-left: 4px;
    }
  </style>
  <script type="text/javascript">
    let timeLeft = 1800; // 30 minutos en segundos
    function startCountdown() {
      const countdownEl = document.getElementById('countdown');
      const interval = setInterval(() => {
        timeLeft--;
        if (timeLeft <= 0) {
          clearInterval(interval);
          location.reload();
        } else {
          const minutes = Math.floor(timeLeft / 60);
          const seconds = timeLeft % 60;
          if (countdownEl) {
            countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
          }
        }
      }, 1000);
    }
    window.onload = startCountdown;
  </script>
</head>
<body link="white">

<div class="countdown-badge">
  Refresco en:<span id="countdown" class="countdown-time">30:00</span>
</div>

<div class="contenedor">
  <iframe
    src="https://sslecal2.investing.com?columns=exc_flags,exc_currency,exc_importance,exc_actual,exc_forecast,exc_previous&amp;importance=3&amp;countries=5&amp;calType=week&amp;timeZone=48&amp;lang=4"
    allowtransparency="true" marginwidth="0" marginheight="0"
    frameborder="0" height="600" width="650"></iframe>
</div>

</body>
</html>
